<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #121212; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 32px; border-radius: 8px; width: 100%; max-width: 400px; border: 1px solid #333; border-top: 6px solid #673AB7; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { color: #bb86fc; margin-bottom: 20px; text-align: center; font-weight: 500; }
        .input-group { margin-bottom: 20px; }
        input[type="email"], input[type="password"] { width: 100%; border: none; border-bottom: 1px solid #555; padding: 10px 0; font-size: 14px; outline: none; background: transparent; color: white; }
        input:focus { border-bottom: 2px solid #bb86fc; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: 500; cursor: pointer; font-size: 14px; color: white; background-color: #673AB7; margin-top: 15px; }
        button:hover { background-color: #512DA8; }
        .alert { background: #cf6679; color: black; padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Admin Portal Login</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="alert">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="input-group">
                <input type="email" name="email" placeholder="Admin Email" required>
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Admin Password" required>
            </div>
            <button type="submit">Login as Admin</button>
        </form>
    </div>
</body>
</html>
