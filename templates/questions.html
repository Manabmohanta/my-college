<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Profile Details</title></head>
<body style="background:#EDE7F6;display:flex;justify-content:center;padding:20px;">
<div style="background:#fff;padding:30px;border-radius:8px;width:400px;border-top:8px solid #673AB7;">
<h2>Complete Your Profile</h2>
<form method="POST">
<label>Full Name:</label><input type="text" name="ans1" required style="width:100%;margin:5px 0 15px;padding:8px;">
<label>Mobile Number:</label><input type="tel" name="ans2" required style="width:100%;margin:5px 0 15px;padding:8px;">
<label>Roll Number:</label><input type="text" name="ans3" required style="width:100%;margin:5px 0 15px;padding:8px;">
<label>Stream:</label><input type="text" name="ans4" required style="width:100%;margin:5px 0 15px;padding:8px;">
<button type="submit" style="background:#673AB7;color:#fff;padding:10px;width:100%;border:none;border-radius:4px;">Submit</button>
</form></div></body></html>
